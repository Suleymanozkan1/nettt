services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stage}
      POSTGRES_DB: stagestack
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stage -d stagestack"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://stage:${POSTGRES_PASSWORD:-stage}@postgres:5432/stagestack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  game:
    build:
      context: .
      dockerfile: apps/game/Dockerfile
      args: { VITE_API_URL: "${VITE_API_URL:-http://localhost:3000}" }
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
