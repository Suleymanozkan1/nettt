# BookMind AI: Gemini and book-summary settings. Change a value and rebuild the app.
# The API key does NOT belong here: put it in local.properties (gemini.apiKey=...) or the
# GEMINI_API_KEY environment variable. Both stay out of git.

# Gemini model. Current Flash models: https://ai.google.dev/gemini-api/docs/models
# (checked October 2026: gemini-3.8-flash is the newest stable Flash model; gemini-3.5-flash-lite is cheaper).
gemini.model=gemini-3.8-flash
# How much the model "thinks" before answering: low, medium or high (gemini-3.8-flash has no "minimal").
# Thinking tokens are billed as output; summaries do not need more than "low".
gemini.thinkingLevel=low
# Retries after a rate limit (429), server error (5xx) or network error, with exponential backoff.
gemini.maxRetries=6

# Each chapter summary is about this share of the chapter's length (0.10 = 10 %).
summary.chapterRatio=0.10
# Length of the whole-book summary in words.
summary.overallMinWords=2000
summary.overallMaxWords=4000
# The book is sent in requests of about this many words (chapters split or grouped to fit).
summary.chunkMinWords=5000
summary.chunkMaxWords=8000
